<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ski Calendar - Base</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:sans-serif;background:#111;color:#eee;padding:30px;">

<h1>Ski Calendar (base test)</h1>
<div id="status">Waiting for script to run...</div>
<ul id="list"></ul>

<hr>
<input id="name-input" placeholder="Your name">
<button id="add-btn">Add test booking</button>

<script>
document.getElementById('status').textContent = 'Script running. Connecting...';

var supabase = window.supabase.createClient(
  'https://kmjxhtgkcvkilluquogw.supabase.co',
  'sb_publishable_oQaCmNxNMRb9PECr806PuA_Ysi9htcS'
);

function refresh() {
  document.getElementById('status').textContent = 'Loading rows...';
  supabase.from('booking_requests').select('*').then(function(result) {
    if (result.error) {
      document.getElementById('status').textContent = 'ERROR: ' + JSON.stringify(result.error);
      return;
    }
    document.getElementById('status').textContent = 'Loaded OK. ' + result.data.length + ' rows.';
    var list = document.getElementById('list');
    list.innerHTML = '';
    result.data.forEach(function(row) {
      var li = document.createElement('li');
      li.textContent = row.guest_name + ' - ' + row.room_id + ' - ' + row.status;
      list.appendChild(li);
    });
  });
}

document.getElementById('add-btn').addEventListener('click', function() {
  var name = document.getElementById('name-input').value || 'Test Person';
  supabase.from('booking_requests').insert({
    room_id: 'r1',
    slot_index: 0,
    guest_name: name,
    start_date: '2027-01-16',
    end_date: '2027-01-16',
    status: 'pending'
  }).then(function(result) {
    if (result.error) {
      alert('Insert error: ' + JSON.stringify(result.error));
    }
    refresh();
  });
});

refresh();
</script>

</body>
</html>
