<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Supabase Connection Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:monospace;background:#111;color:#eee;padding:30px;line-height:1.6;font-size:15px;}
  h1{font-size:18px;}
  .step{margin:16px 0;padding:12px 16px;border-left:3px solid #555;}
  .ok{border-color:#4caf50;color:#8ee08e;}
  .fail{border-color:#e05555;color:#ff9d9d;}
  .pending{border-color:#e0a555;color:#ffcf8e;}
  pre{white-space:pre-wrap;word-break:break-all;background:#000;padding:10px;border-radius:4px;font-size:13px;}
</style>
</head>
<body>
<h1>Supabase Connection Test</h1>
<div id="log"></div>

<script>
const SUPABASE_URL = 'https://kmjxhtgkcvkilluquogw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oQaCmNxNMRb9PECr806PuA_Ysi9htcS';

const log = document.getElementById('log');
function step(label, cls, detail){
  const div = document.createElement('div');
  div.className = 'step ' + cls;
  div.innerHTML = '<b>' + label + '</b>' + (detail ? '<pre>' + detail + '</pre>' : '');
  log.appendChild(div);
}

(async () => {
  step('1. Checking if the Supabase script loaded...', 'pending');
  if(!window.supabase){
    step('1. Supabase script FAILED to load', 'fail', 'window.supabase is undefined. This means the browser could not reach cdn.jsdelivr.net at all — check for an ad blocker, VPN, or firewall blocking that domain.');
    return;
  }
  step('1. Supabase script loaded OK', 'ok');

  step('2. Creating client...', 'pending');
  let supabase;
  try{
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    step('2. Client created OK', 'ok');
  }catch(e){
    step('2. Client creation FAILED', 'fail', String(e));
    return;
  }

  step('3. Setting up realtime channel subscription (like the real app does)...', 'pending');
  try{
    supabase.channel('booking_requests_changes_test')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'booking_requests' }, () => {})
      .subscribe((status) => {
        step('3b. Realtime subscription status changed: ' + status, status === 'SUBSCRIBED' ? 'ok' : 'pending');
      });
    step('3. Realtime channel().subscribe() call completed without throwing', 'ok');
  }catch(e){
    step('3. Realtime subscription setup FAILED', 'fail', String(e));
  }

  step('4. Querying booking_requests table WITH .order() — exact query the real app uses (10s timeout)...', 'pending');
  const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('TIMED OUT after 10s — request never returned at all')), 10000));
  try{
    const result = await Promise.race([
      supabase.from('booking_requests').select('*').order('start_date'),
      timeoutPromise
    ]);
    if(result.error){
      step('4. Query with .order() returned an ERROR', 'fail', JSON.stringify(result.error, null, 2));
    } else {
      step('4. Query with .order() SUCCEEDED', 'ok', 'Rows returned: ' + result.data.length);
    }
  }catch(e){
    step('4. Query with .order() FAILED / timed out', 'fail', String(e && e.message || e));
  }
})();
</script>
</body>
</html>
