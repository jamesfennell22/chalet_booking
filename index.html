<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ski Calendar - Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0C1310; --panel:#141F1A; --panel-raised:#1A2822; --snow:#F2F0EA; --muted:#8CA095;
    --amber:#E2984B; --amber-soft: rgba(226,152,75,0.14); --green:#6FA96B; --red:#C4574C;
    --line: rgba(242,240,234,0.07); --line-strong: rgba(242,240,234,0.16);
    --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--snow);font-family:var(--font-body);padding:30px;}
  h1{font-family:var(--font-display);font-weight:600;}
  #status{font-family:var(--font-mono);font-size:13px;color:var(--muted);margin:16px 0;}
  ul{font-family:var(--font-body);}
  input{background:var(--panel-raised);border:1px solid var(--line-strong);color:var(--snow);padding:8px 12px;border-radius:8px;}
  button{background:var(--amber);border:none;color:#1B1208;font-weight:600;padding:8px 16px;border-radius:8px;cursor:pointer;}
  table{border-collapse:separate;border-spacing:3px;margin-top:16px;}
  td, th{padding:6px 10px;font-size:12px;text-align:center;}
  td.cell{background:var(--panel-raised);border-radius:6px;min-width:40px;}
  td.cell.has-booking{background:rgba(111,169,107,0.4);}
</style>
</head>
<body>

<h1>Ski Calendar (base test - grid)</h1>
<div id="status">Waiting for script to run...</div>
<table id="cal-table"></table>

<hr>
<input id="name-input" placeholder="Your name">
<button id="add-btn">Add test booking (Room 1, Jan 16)</button>

<script>
document.getElementById('status').textContent = 'Script running. Connecting...';

const supabase = window.supabase.createClient(
  'https://kmjxhtgkcvkilluquogw.supabase.co',
  'sb_publishable_oQaCmNxNMRb9PECr806PuA_Ysi9htcS'
);

const ROOMS = ['r1', 'r2', 'r3'];
function buildDates(){
  const dates = [];
  let d = new Date('2027-01-16T00:00:00Z');
  const end = new Date('2027-02-12T00:00:00Z');
  while(d <= end){ dates.push(new Date(d)); d.setUTCDate(d.getUTCDate()+1); }
  return dates;
}
const DATES = buildDates();
function dkey(d){ return d.toISOString().slice(0,10); }

let requests = [];

function renderTable(){
  const table = document.getElementById('cal-table');
  let html = '<tr><th></th>';
  DATES.forEach(d => { html += '<th>' + d.getUTCDate() + '</th>'; });
  html += '</tr>';
  ROOMS.forEach(roomId => {
    html += '<tr><td>' + roomId + '</td>';
    DATES.forEach(d => {
      const date = dkey(d);
      const has = requests.some(r => r.room_id === roomId && date >= r.start_date && date <= r.end_date);
      html += '<td class="cell' + (has ? ' has-booking' : '') + '"></td>';
    });
    html += '</tr>';
  });
  table.innerHTML = html;
}

async function refresh(){
  document.getElementById('status').textContent = 'Loading rows...';
  const { data, error } = await supabase.from('booking_requests').select('*');
  if(error){
    document.getElementById('status').textContent = 'ERROR: ' + JSON.stringify(error);
    return;
  }
  requests = data;
  document.getElementById('status').textContent = 'Loaded OK. ' + data.length + ' rows.';
  renderTable();
}

document.getElementById('add-btn').addEventListener('click', async () => {
  const name = document.getElementById('name-input').value || 'Test Person';
  const { error } = await supabase.from('booking_requests').insert({
    room_id: 'r1', slot_index: 0, guest_name: name,
    start_date: '2027-01-16', end_date: '2027-01-16', status: 'pending'
  });
  if(error) alert('Insert error: ' + JSON.stringify(error));
  await refresh();
});

renderTable();
refresh();
</script>

</body>
</html>
